# AWS Amplify Hosting のビルド設定。FE（Next.js）は web/ にある（モノレポ）
# Amplify の環境変数 AMPLIFY_MONOREPO_APP_ROOT=web と、下の appRoot をそろえる
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            # web/.node-version と同じ Node.js 24 を使う
            - nvm install 24
            - nvm use 24
            - node -v
            - npm ci
        build:
          commands:
            # Amplify の画面で設定した NEXT_PUBLIC_ の環境変数を、サーバー側（共有ページ）からも読めるようにする
            - env | grep -e '^NEXT_PUBLIC_' >> .env.production || true
            # prebuild で MapLibre の Worker を public/ にコピーしてから、next build が走る
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
